<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aapka Physics Tutor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: lab-notebook — a fixed chapter index on the left, one section open at a time on the right,
   split into Theory / Visual / Practice. Navy ink from the diagrams, amber for the active marker. */
:root{
  --bg:#f3f5f9; --paper:#ffffff; --ink:#14203b; --ink-2:#4a5672; --ink-3:#7c869d;
  --rule:#d9dfea; --rule-2:#e8ecf3; --navy:#1e3a8a; --navy-soft:#e3e9f8; --amber:#d97706; --amber-soft:#fdf1dc;
  --good:#0f7a4a; --good-soft:#dcf4e8; --bad:#c2312b; --bad-soft:#fbe3e1;
  --grid:rgba(30,58,138,.05);
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
  --side:290px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1424; --paper:#151d31; --ink:#e7ecf7; --ink-2:#aab4cc; --ink-3:#7b86a1;
  --rule:#27324d; --rule-2:#1e2740; --navy:#93acf5; --navy-soft:#1f2c50; --amber:#f5a524; --amber-soft:#3a2a10;
  --good:#4ad391; --good-soft:#123826; --bad:#ff7b72; --bad-soft:#41191a; --grid:rgba(147,172,245,.05); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e1424; --paper:#151d31; --ink:#e7ecf7; --ink-2:#aab4cc; --ink-3:#7b86a1;
  --rule:#27324d; --rule-2:#1e2740; --navy:#93acf5; --navy-soft:#1f2c50; --amber:#f5a524; --amber-soft:#3a2a10;
  --good:#4ad391; --good-soft:#123826; --bad:#ff7b72; --bad-soft:#41191a; --grid:rgba(147,172,245,.05); color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16.5px;line-height:1.6;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
a{color:var(--navy)}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--amber);outline-offset:2px;border-radius:6px}

.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100%}

/* ---------- sidebar ---------- */
.side{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));overflow:auto;
  background:var(--paper);border-right:1px solid var(--rule);padding:22px 0 30px;
  padding-left:max(0px, env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;padding:0 20px 18px;text-decoration:none;color:var(--ink)}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--navy);color:var(--paper);display:grid;place-items:center;
  font-family:var(--f-display);font-weight:800;font-size:18px}
.brand b{font-family:var(--f-display);font-weight:800;font-size:18px;line-height:1.1;display:block}
.brand small{color:var(--ink-3);font-size:12.5px}
.ch{border-top:1px solid var(--rule-2);padding:14px 0 6px}
.ch-head{padding:0 20px 8px;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.ch-title{padding:0 20px 8px;font-family:var(--f-display);font-weight:700;font-size:16px;line-height:1.25}
.sec-link{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:6px;padding:7px 16px 7px 20px;
  text-decoration:none;color:var(--ink-2);border-left:3px solid transparent;font-size:14.5px;line-height:1.3}
.sec-link:hover{background:var(--rule-2);color:var(--ink)}
.sec-link[aria-current="page"]{border-left-color:var(--amber);background:var(--amber-soft);color:var(--ink);font-weight:700}
.sec-link .num{font-family:var(--f-mono);font-size:12.5px;color:var(--navy);font-weight:700}
.pip{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.pip.done{color:var(--good)}

/* ---------- top bar (mobile) ---------- */
.topbar{display:none}
@media (max-width: 860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:min(86vw,320px);height:100%;z-index:40;transform:translateX(-102%);transition:transform .22s ease;
    padding-top:calc(22px + env(safe-area-inset-top,0px));box-shadow:0 0 40px rgba(0,0,0,.25)}
  .side.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(10,15,30,.4);z-index:35}
  .topbar{display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);
    border-bottom:1px solid var(--rule);padding-block:10px;
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .topbar b{font-family:var(--f-display);font-weight:800}
  .menu-btn{border:1px solid var(--rule);background:var(--bg);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:700;font-size:14px}
}
@media (prefers-reduced-motion: reduce){ .side{transition:none} }

/* ---------- main ---------- */
.main{min-width:0;padding-block:34px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.crumb{font-size:13px;color:var(--ink-3);display:flex;gap:8px;flex-wrap:wrap}
.crumb a{color:var(--ink-3)}
.sec-head{display:flex;gap:16px;align-items:flex-start}
.badge{flex:none;font-family:var(--f-mono);font-weight:700;background:var(--navy);color:var(--paper);border-radius:10px;padding:6px 12px;font-size:20px;line-height:1.3}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,4.4vw,40px);line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.01em}
.sub{margin:6px 0 0;color:var(--ink-2)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule);overflow-x:auto}
.tab{appearance:none;border:0;background:none;padding:10px 16px 11px;cursor:pointer;font-weight:700;color:var(--ink-3);
  border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;font-size:15px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--amber)}
.tab .cnt{font-family:var(--f-mono);font-size:12px;background:var(--rule-2);border-radius:999px;padding:1px 7px;margin-left:6px;color:var(--ink-2)}

/* theory */
.prose{background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:26px clamp(18px,4vw,36px)}
.prose > :first-child{margin-top:0}
.prose p,.prose li{max-width:68ch}
.prose h3,.prose h4{font-family:var(--f-display);font-weight:700;font-size:19px;margin:28px 0 8px}
.prose strong{color:var(--ink)}
.prose hr{border:0;border-top:1px dashed var(--rule);margin:26px 0}
.prose ul,.prose ol{padding-left:22px}
.prose li{margin:3px 0}
.prose code{font-family:var(--f-mono);font-size:.9em;background:var(--rule-2);padding:1px 5px;border-radius:4px}
.tbl{overflow-x:auto;margin:14px 0;border:1px solid var(--rule);border-radius:10px}
.tbl table{border-collapse:collapse;width:100%;font-size:14.5px;font-variant-numeric:tabular-nums}
.tbl th{background:var(--navy-soft);color:var(--ink);text-align:left;font-weight:700}
.tbl th,.tbl td{padding:8px 12px;border-bottom:1px solid var(--rule-2);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.prose blockquote{margin:16px 0;padding:12px 16px;border-radius:10px;background:var(--navy-soft);border:1px solid var(--rule)}
.prose blockquote.warn{background:var(--amber-soft)}
.prose blockquote p{margin:4px 0}
.prose blockquote ul{margin:4px 0}

/* visual */
.figure{background:#fff;border:1px solid var(--rule);border-radius:14px;padding:10px;margin:0}
.figure img{display:block;width:100%;height:auto;border-radius:8px}
.figure figcaption{font-size:13px;color:#5d6780;padding:8px 6px 2px}

/* practice */
.scorebar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:12px 16px}
.meter{flex:1 1 180px;height:10px;background:var(--rule-2);border-radius:99px;overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.meter .g{background:var(--good)} .meter .b{background:var(--bad)}
.score-txt{font-variant-numeric:tabular-nums;font-size:14.5px;color:var(--ink-2)}
.score-txt b{color:var(--ink)}
.btn{border:1px solid var(--rule);background:var(--bg);border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:700;font-size:14px}
.btn:hover{border-color:var(--navy);color:var(--navy)}
.btn.primary{background:var(--navy);color:var(--paper);border-color:var(--navy)}
.btn.primary:hover{color:var(--paper);filter:brightness(1.1)}
.group-h{font-family:var(--f-display);font-weight:700;font-size:17px;margin:10px 0 -6px;color:var(--ink-2)}
.q{background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:18px clamp(16px,3vw,24px)}
.q-top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:6px}
.q-no{font-family:var(--f-mono);font-weight:700;font-size:13px;color:var(--navy)}
.diff{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;border-radius:99px;padding:2px 9px;border:1px solid currentColor}
.diff.recall{color:var(--good)} .diff.understanding{color:var(--amber)} .diff.application{color:var(--bad)}
.q-prompt{font-size:17px;margin:4px 0 14px;max-width:68ch}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:10px;text-align:left;width:100%;
  border:1.5px solid var(--rule);background:var(--bg);border-radius:10px;padding:10px 12px;cursor:pointer;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--navy);background:var(--navy-soft)}
.opt:disabled{cursor:default}
.opt .letter{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:13px;
  background:var(--paper);border:1px solid var(--rule);color:var(--ink-2)}
.opt .mark{font-weight:700;font-size:13px;white-space:nowrap}
.opt.correct{border-color:var(--good);background:var(--good-soft)}
.opt.correct .letter{background:var(--good);color:var(--paper);border-color:var(--good)}
.opt.correct .mark{color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .letter{background:var(--bad);color:var(--paper);border-color:var(--bad)}
.opt.wrong .mark{color:var(--bad)}
.opt.dim{opacity:.55}
.feedback{margin-top:12px;padding:12px 14px;border-radius:10px;font-size:15px;border:1px solid var(--rule)}
.feedback.ok{background:var(--good-soft);border-color:transparent}
.feedback.no{background:var(--bad-soft);border-color:transparent}
.feedback b{display:block;margin-bottom:2px}
.feedback.ok b{color:var(--good)} .feedback.no b{color:var(--bad)}
.q-actions{margin-top:10px;display:flex;gap:8px}
.linkbtn{border:0;background:none;padding:0;color:var(--navy);cursor:pointer;font-weight:700;font-size:14px;text-decoration:underline;text-underline-offset:3px}

.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pager a{flex:1 1 220px;text-decoration:none;background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:12px 16px;color:var(--ink)}
.pager a:hover{border-color:var(--navy)}
.pager small{display:block;color:var(--ink-3);font-size:12.5px}
.pager .next{text-align:right}

/* home */
.hero h1{font-size:clamp(30px,5vw,46px)}
.hero p{color:var(--ink-2);max-width:60ch;margin:10px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:14px 16px}
.card:hover{border-color:var(--navy)}
.card .num{font-family:var(--f-mono);font-weight:700;color:var(--navy);font-size:13px}
.card b{font-family:var(--f-display);font-size:17px;line-height:1.25}
.card .meta{font-size:13px;color:var(--ink-3);display:flex;justify-content:space-between;gap:8px;margin-top:auto;padding-top:6px}
.ch-block h2{font-family:var(--f-display);font-weight:800;font-size:24px;margin:8px 0 12px}
.ch-block h2 span{font-family:var(--f-mono);font-size:14px;color:var(--ink-3);font-weight:500;margin-right:8px}
.err{background:var(--bad-soft);border-radius:12px;padding:16px}
</style>

<div class="app">
  <aside class="side" id="side" aria-label="Chapters and sections">
    <a class="brand" href="#">
      <span class="brand-mark">φ</span>
      <span><b>Aapka Physics Tutor</b><small>HC Verma · Class 11</small></span>
    </a>
    <nav id="nav"></nav>
  </aside>
  <div class="scrim" id="scrim" hidden></div>
  <div style="min-width:0">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn" aria-controls="side" aria-expanded="false">Sections</button>
      <b>Aapka Physics Tutor</b>
    </header>
    <main class="main"><div class="wrap" id="view"><p class="sub">Loading chapters…</p></div></main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
(() => {
  const view = document.getElementById('view');
  const nav = document.getElementById('nav');
  let INDEX = null;
  const cache = {};               // section json by slug
  const DIFF_LABEL = {recall:'Recall', understanding:'Understanding', application:'Application'};

  // ---------- progress (per-viewer convenience only) ----------
  const KEY = 'apt-progress-v1';
  let progress = {};
  try { progress = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { progress = {}; }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(progress)); } catch (e) {} };

  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const inline = s => (window.marked ? marked.parseInline(s) : esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>'));

  // ---------- data ----------
  async function getJSON(url) {
    const r = await fetch(url);
    if (!r.ok) throw new Error(url + ' returned ' + r.status);
    return r.json();
  }
  async function loadSection(meta) {
    if (!cache[meta.slug]) cache[meta.slug] = await getJSON(meta.file);
    return cache[meta.slug];
  }
  function allSections() {
    const out = [];
    INDEX.chapters.forEach(ch => ch.sections.forEach(s => out.push({ch, s})));
    return out;
  }
  function sectionScore(slug, total) {
    const p = progress[slug] || {};
    const vals = Object.values(p);
    return {answered: vals.length, correct: vals.filter(v => v.ok).length, total};
  }

  // ---------- routing: #ch01-1-3 or #ch01-1-3-visual / -practice ----------
  function parseHash() {
    const h = decodeURIComponent(location.hash.slice(1));
    const m = h.match(/^(.*?)(?:-(theory|visual|practice))?$/);
    return {slug: m ? m[1] : '', tab: (m && m[2]) || 'theory'};
  }

  function renderNav(activeSlug) {
    nav.innerHTML = INDEX.chapters.map(ch => `
      <div class="ch">
        <div class="ch-head">Chapter ${ch.number ?? ''}</div>
        <div class="ch-title">${esc(ch.title)}</div>
        ${ch.sections.map(s => {
          const sc = sectionScore(s.slug, s.questionCount);
          const done = sc.answered === sc.total && sc.total > 0;
          return `<a class="sec-link" href="#${s.slug}" ${s.slug === activeSlug ? 'aria-current="page"' : ''}>
            <span class="num">${s.id}</span><span>${esc(s.title)}</span>
            <span class="pip ${done ? 'done' : ''}" title="Questions answered">${sc.answered}/${sc.total}</span></a>`;
        }).join('')}
      </div>`).join('');
  }

  function renderHome() {
    document.title = 'Aapka Physics Tutor';
    const total = allSections().reduce((n, x) => n + x.s.questionCount, 0);
    view.innerHTML = `
      <section class="hero">
        <h1>Learn it, see it, test it.</h1>
        <p>Every section of the HC Verma chapters has three parts: the theory, a one-page visual summary, and practice MCQs that tell you right away whether your answer is right. ${INDEX.chapters.length} chapter${INDEX.chapters.length>1?'s':''} · ${total} questions so far.</p>
      </section>
      ${INDEX.chapters.map(ch => `
        <section class="ch-block">
          <h2><span>CH ${String(ch.number ?? '').padStart(2,'0')}</span>${esc(ch.title)}</h2>
          <div class="grid">
            ${ch.sections.map(s => { const sc = sectionScore(s.slug, s.questionCount); return `
              <a class="card" href="#${s.slug}">
                <span class="num">${s.id}</span><b>${esc(s.title)}</b>
                <span class="meta"><span>${s.questionCount} MCQs</span><span>${sc.answered ? `${sc.correct}/${sc.total} correct` : 'Not started'}</span></span>
              </a>`; }).join('')}
          </div>
        </section>`).join('')}`;
  }

  function theoryHTML(md) {
    const html = window.marked ? marked.parse(md) : `<div style="white-space:pre-wrap">${esc(md)}</div>`;
    const tmp = document.createElement('div');
    tmp.innerHTML = html;
    tmp.querySelectorAll('table').forEach(t => { const w = document.createElement('div'); w.className = 'tbl'; t.replaceWith(w); w.appendChild(t); });
    tmp.querySelectorAll('blockquote').forEach(b => { if (b.textContent.trim().startsWith('⚠')) b.classList.add('warn'); });
    tmp.querySelectorAll('img').forEach(i => i.remove());
    return tmp.innerHTML;
  }

  async function renderSection(slug, tab) {
    const list = allSections();
    const i = list.findIndex(x => x.s.slug === slug);
    if (i < 0) { location.hash = ''; return; }
    const {ch, s} = list[i];
    let sec;
    try { sec = await loadSection(s); }
    catch (e) { view.innerHTML = `<div class="err"><b>Couldn't load section ${s.id}.</b><br>${esc(e.message)}</div>`; return; }
    if (parseHash().slug !== slug) return; // user navigated away while loading
    document.title = `${s.id} ${sec.title} · Aapka Physics Tutor`;
    const prev = list[i-1], next = list[i+1];

    view.innerHTML = `
      <div class="crumb"><a href="#">All chapters</a><span>/</span><span>Chapter ${ch.number}: ${esc(ch.title)}</span></div>
      <div class="sec-head"><span class="badge">${sec.id}</span>
        <div><h1>${esc(sec.title)}</h1></div></div>
      <div class="tabs" role="tablist">
        ${[['theory','Theory'],['visual','Visual'],['practice','Practice MCQs']].map(([k,l]) =>
          `<button class="tab" role="tab" id="tab-${k}" aria-selected="${tab===k}" data-tab="${k}">${l}${k==='practice'?`<span class="cnt">${sec.questions.length}</span>`:''}</button>`).join('')}
      </div>
      <div id="panel" role="tabpanel"></div>
      <nav class="pager">
        ${prev ? `<a href="#${prev.s.slug}"><small>← Previous</small>${prev.s.id} ${esc(prev.s.title)}</a>` : '<span></span>'}
        ${next ? `<a class="next" href="#${next.s.slug}"><small>Next →</small>${next.s.id} ${esc(next.s.title)}</a>` : ''}
      </nav>`;

    view.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
      const t = b.dataset.tab;
      history.replaceState(null, '', '#' + slug + (t === 'theory' ? '' : '-' + t));
      view.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', x === b));
      drawPanel(sec, t);
    }));
    drawPanel(sec, tab);
    window.scrollTo({top: 0});
  }

  function drawPanel(sec, tab) {
    const panel = document.getElementById('panel');
    if (tab === 'visual') {
      panel.innerHTML = sec.diagram
        ? `<figure class="figure"><img src="${esc(sec.diagram)}" alt="Summary diagram for ${esc(sec.id)} ${esc(sec.title)}" loading="lazy"><figcaption>Summary diagram · ${esc(sec.id)} ${esc(sec.title)}</figcaption></figure>`
        : `<p class="sub">No diagram for this section yet.</p>`;
    } else if (tab === 'practice') {
      drawPractice(sec, panel);
    } else {
      panel.innerHTML = `<article class="prose">${theoryHTML(sec.theory)}</article>
        <p style="margin-top:16px"><button class="btn primary" id="goPractice">Practise ${sec.questions.length} MCQs →</button></p>`;
      document.getElementById('goPractice').onclick = () => document.getElementById('tab-practice').click();
    }
  }

  function drawPractice(sec, panel) {
    const st = progress[sec.slug] || (progress[sec.slug] = {});
    let lastGroup = null;
    panel.innerHTML = `
      <div style="display:flex;flex-direction:column;gap:14px">
        <div class="scorebar" id="score"></div>
        ${sec.questions.map(q => {
          const g = q.group && q.group !== lastGroup ? `<h3 class="group-h">${esc(q.group)}</h3>` : '';
          lastGroup = q.group;
          return g + `<article class="q" id="q-${q.id}" data-q="${q.id}">
            <div class="q-top"><span class="q-no">Q${q.n}</span><span class="diff ${q.difficulty}">${DIFF_LABEL[q.difficulty]}</span></div>
            <div class="q-prompt">${inline(q.prompt)}</div>
            <div class="opts">${q.options.map(o => `<button class="opt" data-opt="${o.id}"><span class="letter">${o.id}</span><span>${inline(o.text)}</span><span class="mark"></span></button>`).join('')}</div>
            <div class="fb-slot"></div>
          </article>`;
        }).join('')}
      </div>`;

    const updateScore = () => {
      const sc = sectionScore(sec.slug, sec.questions.length);
      const pct = n => (100 * n / sc.total) + '%';
      document.getElementById('score').innerHTML = `
        <span class="score-txt"><b>${sc.correct}</b> correct · <b>${sc.answered - sc.correct}</b> wrong · ${sc.total - sc.answered} left</span>
        <span class="meter" aria-hidden="true"><i class="g" style="width:${pct(sc.correct)}"></i><i class="b" style="width:${pct(sc.answered - sc.correct)}"></i></span>
        <button class="btn" id="resetAll">Reset section</button>`;
      document.getElementById('resetAll').onclick = () => { progress[sec.slug] = {}; save(); drawPractice(sec, panel); renderNav(sec.slug); };
    };

    const lock = (card, q, chosen) => {
      const ok = chosen === q.answer;
      card.querySelectorAll('.opt').forEach(b => {
        b.disabled = true;
        const id = b.dataset.opt;
        if (id === q.answer) { b.classList.add('correct'); b.querySelector('.mark').textContent = id === chosen ? '✓ Your answer' : '✓ Correct answer'; }
        else if (id === chosen) { b.classList.add('wrong'); b.querySelector('.mark').textContent = '✗ Your answer'; }
        else b.classList.add('dim');
      });
      card.querySelector('.fb-slot').innerHTML = `
        <div class="feedback ${ok ? 'ok' : 'no'}" role="status"><b>${ok ? 'Correct!' : `Not quite. The answer is (${q.answer}).`}</b>${inline(q.explanation)}</div>
        <div class="q-actions"><button class="linkbtn" data-retry>Try this question again</button></div>`;
      card.querySelector('[data-retry]').onclick = () => {
        delete st[q.id]; save();
        card.querySelectorAll('.opt').forEach(b => { b.disabled = false; b.classList.remove('correct','wrong','dim'); b.querySelector('.mark').textContent = ''; });
        card.querySelector('.fb-slot').innerHTML = ''; updateScore(); renderNav(sec.slug);
      };
    };

    sec.questions.forEach(q => {
      const card = panel.querySelector(`[data-q="${CSS.escape(q.id)}"]`);
      if (st[q.id]) lock(card, q, st[q.id].chosen);
      card.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
        const chosen = b.dataset.opt;
        st[q.id] = {chosen, ok: chosen === q.answer}; save();
        lock(card, q, chosen); updateScore(); renderNav(sec.slug);
      }));
    });
    updateScore();
  }

  function route() {
    closeMenu();
    const {slug, tab} = parseHash();
    renderNav(slug);
    if (!slug) renderHome(); else renderSection(slug, tab);
  }

  // ---------- mobile menu ----------
  const side = document.getElementById('side'), scrim = document.getElementById('scrim'), menuBtn = document.getElementById('menuBtn');
  function closeMenu(){ side.classList.remove('open'); scrim.hidden = true; menuBtn.setAttribute('aria-expanded','false'); }
  menuBtn.onclick = () => { const o = !side.classList.contains('open'); side.classList.toggle('open', o); scrim.hidden = !o; menuBtn.setAttribute('aria-expanded', o); };
  scrim.onclick = closeMenu;

  window.addEventListener('hashchange', route);
  getJSON('content/index.json')
    .then(d => { INDEX = d; route(); })
    .catch(e => { view.innerHTML = `<div class="err"><b>Couldn't load the chapter index.</b><br>${esc(e.message)}<br>If you opened this file directly from your computer, run a local server in the site folder instead (for example <code>python -m http.server</code>) and open http://localhost:8000.</div>`; });
})();
</script>
